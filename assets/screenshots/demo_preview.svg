<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="url(#bgGrad)" />

  <!-- App Header -->
  <text x="500" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#c7d2fe">🎮 WordNet AI Hangman</text>
  <text x="500" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Supervised Gradient-Boosting Letter Recommender &amp; WordNet Vocabulary</text>

  <!-- Left Main Board Container -->
  <rect x="50" y="110" width="560" height="400" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Word Display Box -->
  <text x="75" y="140" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">WORD</text>
  <rect x="75" y="152" width="510" height="65" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="330" y="196" text-anchor="middle" font-family="monospace" font-size="32" font-weight="800" letter-spacing="12" fill="#38bdf8">_ _ A _ _ _</text>

  <!-- Guessed Letters & Attempts -->
  <text x="75" y="242" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">GUESSED LETTERS</text>
  <rect x="75" y="252" width="310" height="42" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="95" y="278" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">A, E, R</text>

  <text x="405" y="242" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ATTEMPTS REMAINING</text>
  <rect x="405" y="252" width="180" height="42" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="495" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f59e0b">4 / 6</text>

  <!-- Status -->
  <text x="75" y="316" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">STATUS</text>
  <rect x="75" y="326" width="510" height="38" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="95" y="350" font-family="sans-serif" font-size="14" fill="#10b981">Keep playing!</text>

  <!-- Input Field & Buttons -->
  <rect x="75" y="380" width="220" height="42" rx="8" fill="#0f172a" stroke="#475569" />
  <text x="95" y="406" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">T</text>

  <rect x="310" y="380" width="140" height="42" rx="8" fill="url(#accentGrad)" />
  <text x="380" y="406" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Guess Letter</text>

  <rect x="465" y="380" width="120" height="42" rx="8" fill="url(#primaryGrad)" />
  <text x="525" y="406" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">New Game</text>

  <!-- Mini Virtual Keyboard representation -->
  <g transform="translate(75, 442)">
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="14" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Q</text>
    <rect x="34" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="48" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">W</text>
    <rect x="68" y="0" width="28" height="28" rx="4" fill="#1e293b" opacity="0.4" /><text x="82" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">E</text>
    <rect x="102" y="0" width="28" height="28" rx="4" fill="#1e293b" opacity="0.4" /><text x="116" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">R</text>
    <rect x="136" y="0" width="28" height="28" rx="4" fill="#6366f1" /><text x="150" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">T</text>
    <rect x="170" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="184" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Y</text>
    <rect x="204" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="218" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">U</text>
    <rect x="238" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="252" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">I</text>
    <rect x="272" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="286" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">O</text>
    <rect x="306" y="0" width="28" height="28" rx="4" fill="#334155" /><text x="320" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">P</text>
  </g>

  <!-- Right: AI Recommendation & Top 5 Predictions -->
  <rect x="630" y="110" width="320" height="400" rx="16" fill="url(#aiCardGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadow)" />

  <text x="650" y="145" font-family="sans-serif" font-size="18" font-weight="800" fill="#e9d5ff">🤖 AI Recommendation</text>

  <!-- Next Letter & Confidence Badges -->
  <rect x="650" y="165" width="135" height="75" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
  <text x="717" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c084fc">RECOMMENDED</text>
  <text x="717" y="225" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#a855f7">N</text>

  <rect x="795" y="165" width="135" height="75" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="862" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#34d399">CONFIDENCE</text>
  <text x="862" y="222" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" fill="#10b981">18.5%</text>

  <!-- Top 5 Header -->
  <text x="650" y="275" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Top 5 AI Predictions</text>

  <!-- Prediction Rows with Bar Charts -->
  <!-- 1. N -->
  <text x="650" y="306" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">N — 18.5%</text>
  <rect x="760" y="294" width="170" height="14" rx="4" fill="#1e293b" />
  <rect x="760" y="294" width="140" height="14" rx="4" fill="#a855f7" />

  <!-- 2. S -->
  <text x="650" y="342" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">S — 14.2%</text>
  <rect x="760" y="330" width="170" height="14" rx="4" fill="#1e293b" />
  <rect x="760" y="330" width="108" height="14" rx="4" fill="#818cf8" />

  <!-- 3. L -->
  <text x="650" y="378" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">L — 11.7%</text>
  <rect x="760" y="366" width="170" height="14" rx="4" fill="#1e293b" />
  <rect x="760" y="366" width="88" height="14" rx="4" fill="#38bdf8" />

  <!-- 4. T -->
  <text x="650" y="414" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">T — 10.4%</text>
  <rect x="760" y="402" width="170" height="14" rx="4" fill="#1e293b" />
  <rect x="760" y="402" width="78" height="14" rx="4" fill="#38bdf8" />

  <!-- 5. C -->
  <text x="650" y="450" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">C — 8.9%</text>
  <rect x="760" y="438" width="170" height="14" rx="4" fill="#1e293b" />
  <rect x="760" y="438" width="66" height="14" rx="4" fill="#38bdf8" />

  <!-- AI Action Button -->
  <rect x="650" y="472" width="280" height="30" rx="6" fill="#312e81" stroke="#4f46e5" />
  <text x="790" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">✨ Use AI's Top Pick</text>
</svg>
